<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PixelRunner Sound Player</title>
</head>
<body>
  <audio id="completionSound" preload="auto" playsinline>
    <source src="./video/提示音.MP3" type="audio/mpeg" />
  </audio>
  <script>
    (function initSoundPlayer() {
      const audio = document.getElementById("completionSound");
      const state = { enabled: true, volume: 0.8, muted: false };

      function clampVolume(value) {
        const numeric = Number(value);
        if (!Number.isFinite(numeric)) return 0.8;
        return Math.max(0, Math.min(1, numeric));
      }

      function syncAudioConfig() {
        if (!audio) return;
        audio.volume = clampVolume(state.volume);
        audio.muted = Boolean(state.muted);
      }

      function post(message) {
        try {
          window.parent.postMessage(message, "*");
        } catch (_) {}
      }

      async function playSound(reason) {
        if (!state.enabled || state.muted || state.volume <= 0 || !audio) return;
        try {
          audio.pause();
          syncAudioConfig();
          audio.currentTime = 0;
          await audio.play();
          post({ type: "pixelrunner.sound.playback", ok: true, reason: String(reason || "queue-empty") });
        } catch (error) {
          post({
            type: "pixelrunner.sound.playback",
            ok: false,
            reason: String(reason || "queue-empty"),
            message: error && error.message ? error.message : String(error || "playback failed")
          });
        }
      }

      window.addEventListener("message", (event) => {
        const payload = event && event.data;
        if (!payload || typeof payload !== "object") return;
        if (payload.type === "pixelrunner.sound.config") {
          state.enabled = payload.enabled !== false;
          state.volume = clampVolume(payload.volume);
          state.muted = payload.muted === true;
          syncAudioConfig();
          if (!state.enabled && audio) {
            try {
              audio.pause();
              audio.currentTime = 0;
            } catch (_) {}
          }
          return;
        }
        if (payload.type === "pixelrunner.sound.play") {
          if (payload.volume != null) state.volume = clampVolume(payload.volume);
          state.muted = payload.muted === true;
          syncAudioConfig();
          void playSound(payload.reason);
        }
      });

      syncAudioConfig();
      post({ type: "pixelrunner.sound.ready" });
    })();
  </script>
</body>
</html>
